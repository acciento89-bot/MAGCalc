name: Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
    paths:
      - 'android/**'
      - 'store/google-play/**'
      - 'scripts/export_play_icon.py'
      - 'MAGCalc/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'store/google-play/**'
      - 'scripts/export_play_icon.py'
      - 'MAGCalc/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magcalc-android-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 16 SDK and icon validation tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m pip install --disable-pip-version-check -q pillow
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify Google Play icon is rendered from launcher source
        run: python3 scripts/export_play_icon.py --check
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug App Bundle
        run: gradle -p android bundleDebug --stacktrace
      - name: Build unsigned release App Bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify release identity and launcher icon
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          grep -Fq 'applicationId = "de.kamilunavo.magcalc"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 6' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.1.0"' android/app/build.gradle.kts
          IOS_ICON='MAGCalc/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          ANDROID_ICON='android/app/src/main/res/drawable-nodpi/ic_launcher.png'
          grep -Fq 'android:icon="@drawable/ic_launcher"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          cmp -s "$IOS_ICON" "$ANDROID_ICON"
          test ! -e android/app/src/main/res/drawable/app_icon_source.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/values/launcher_colors.xml
          test -z "$(find android/app/src/main/res -type f \( -iname '*adaptive*' -o -iname '*foreground*' -o -iname '*background*' \) -print -quit)"
          ! grep -Fq 'generateLauncherIcon' android/app/build.gradle.kts
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MAGCalc-1.1.0-6-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  native-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify source-only acceptance guards
        run: python3 -m unittest discover -s .github/native-acceptance/tests -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build own debug candidate and separate QA host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/native-acceptance/proof
          git rev-parse HEAD > .github/native-acceptance/proof/source-commit.txt
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p android --no-daemon --max-workers=1 testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee .github/native-acceptance/proof/product-build.log
          gradle -p .github/native-acceptance/host --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee .github/native-acceptance/proof/host-build.log
      - name: Enable official emulator KVM
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Actual MAGCalc native workflow on stock Google APIs image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: MAGNativeAcceptanceApi35
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: bash .github/native-acceptance/run-cloud.sh
      - name: Retain native success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAGCalc-native-service-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: .github/native-acceptance/proof/
          if-no-files-found: warn
          retention-days: 14
