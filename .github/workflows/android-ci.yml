name: Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
    paths:
      - 'android/**'
      - 'store/google-play/**'
      - 'scripts/export_play_icon.py'
      - 'MAGCalc/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'store/google-play/**'
      - 'scripts/export_play_icon.py'
      - 'MAGCalc/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magcalc-android-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK and icon validation tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m pip install --disable-pip-version-check -q pillow
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify Google Play icon is rendered from launcher source
        run: python3 scripts/export_play_icon.py --check
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug App Bundle
        run: gradle -p android bundleDebug --stacktrace
      - name: Build unsigned release App Bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify release identity and launcher icon
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          grep -Fq 'applicationId = "de.kamilunavo.magcalc"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'versionCode = 3' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.2"' android/app/build.gradle.kts
          IOS_ICON='MAGCalc/Assets.xcassets/AppIcon.appiconset/AppIcon.png'
          ANDROID_ICON='android/app/src/main/res/drawable-nodpi/ic_launcher.png'
          grep -Fq 'android:icon="@drawable/ic_launcher"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          cmp -s "$IOS_ICON" "$ANDROID_ICON"
          test ! -e android/app/src/main/res/drawable/app_icon_source.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/values/launcher_colors.xml
          test -z "$(find android/app/src/main/res -type f \( -iname '*adaptive*' -o -iname '*foreground*' -o -iname '*background*' \) -print -quit)"
          ! grep -Fq 'generateLauncherIcon' android/app/build.gradle.kts
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MAGCalc-1.0.2-3-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
